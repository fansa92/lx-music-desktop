name: Release

# 手动触发：在 GitHub 页面 Actions → Release → Run workflow
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: '发布类型（draft 草稿 / prerelease 预发布 / release 正式）'
        required: true
        default: prerelease
        type: choice
        options:
          - prerelease
          - release
          - draft
      publish_owner:
        description: '发布到的 GitHub 仓库 owner'
        required: false
        default: fansa92
        type: string
      publish_repo:
        description: '发布到的 GitHub 仓库名'
        required: false
        default: lx-music-desktop
        type: string
      changelog_from:
        description: '更新日志起始点（tag 或 commit sha）；留空则自动取最近一个 tag'
        required: false
        default: ''
        type: string

# 创建 / 更新 Release 需要写权限
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IS_CI: 'true'
  PUBLISH_OWNER: ${{ inputs.publish_owner || 'fansa92' }}
  PUBLISH_REPO: ${{ inputs.publish_repo || 'lx-music-desktop' }}
  PUBLISH_RELEASE_TYPE: ${{ inputs.release_type || 'prerelease' }}
  CHANGELOG_FROM: ${{ inputs.changelog_from }}
  RELEASE_NOTES_FILE: RELEASE_NOTES.md

